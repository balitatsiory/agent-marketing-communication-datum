# Pile IAGORA — développement local.
#
#   docker compose up -d db
#
# Pendant le développement, seule la base tourne en conteneur. L'API, l'agent et
# le frontend tournent en natif sur le poste : sous Windows, la surveillance de
# fichiers à travers un montage de volume est lente, et une boucle de
# rechargement rapide compte plus qu'une pile homogène à ce stade.
#
# Les trois autres services sont décrits en bas de ce fichier, commentés, et
# seront activés avant la soutenance pour démontrer le déploiement reproductible
# sur un serveur unique annoncé par le mémoire.
#
# L'ancienne pile n8n est archivée dans _archives/n8n/ : n8n est sorti du
# périmètre livré le 18 novembre 2026.

name: iagora

services:
  db:
    # pgvector/pgvector embarque PostgreSQL 16 et l'extension vectorielle.
    # postgres:16-alpine ne l'a pas, et compiler pgvector sur un PostgreSQL
    # Windows natif demande les outils de build Visual Studio : le module 15
    # (base de connaissances) ne pourrait pas être testé.
    image: pgvector/pgvector:pg16
    container_name: iagora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iagora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iagora}
      POSTGRES_DB: ${POSTGRES_DB:-iagora}
      # Dates et tris indépendants de la locale de l'hôte : deux postes
      # différents doivent produire le même ordre et les mêmes horodatages.
      TZ: UTC
    ports:
      # 5433 côté hôte : PostgreSQL 16 est déjà installé sur le poste et
      # occupe 5432. Les deux cohabitent sans conflit.
      #
      # L'écoute est limitée à 127.0.0.1 : le mot de passe de développement est
      # volontairement simple, la base ne doit donc pas être joignable depuis
      # le réseau local.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Scripts d'amorçage, joués UNE SEULE FOIS, à la toute première création
      # du volume. Les modifier ensuite n'a aucun effet : il faut détruire le
      # volume (docker compose down -v) pour qu'ils soient rejoués.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Les futurs services n'attendront pas seulement que le conteneur démarre,
      # mais que la base réponde réellement.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iagora} -d ${POSTGRES_DB:-iagora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # À activer avant la soutenance, une fois les trois briques écrites.
  # --------------------------------------------------------------------------
  #
  # api:
  #   build: ./backend
  #   env_file: ./backend/.env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports: ["127.0.0.1:8000:8000"]
  #
  # agent:
  #   build: ./agent
  #   env_file: ./agent/.env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports: ["127.0.0.1:8100:8100"]
  #
  # web:
  #   build: ./frontend
  #   depends_on: [api]
  #   ports: ["127.0.0.1:8080:80"]

volumes:
  db_data:
