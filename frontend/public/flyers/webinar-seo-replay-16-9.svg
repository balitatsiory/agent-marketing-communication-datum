<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Miniature de la rediffusion : une diapositive sur les Core Web Vitals, avec l'intervenant en médaillon">
  <title>Rediffusion — Les bases du SEO technique · 1920 × 1080</title>

  <defs>
    <!-- Le centre s'assombrit : c'est là que se pose le bouton de lecture,
         dessiné dans la page et non dans l'image. -->
    <radialGradient id="vignette" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#000000" stop-opacity=".34"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0a2430"/>
  <circle cx="1680" cy="180" r="380" fill="#167fa4" opacity=".12"/>

  <!-- diapositive partagée à l'écran -->
  <text x="130" y="210" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700"
        letter-spacing="9" fill="#7fc3dc">03 / 24 · PERFORMANCE</text>
  <text x="130" y="330" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="700"
        fill="#ffffff" letter-spacing="-1.5">CORE WEB VITALS</text>
  <rect x="130" y="380" width="150" height="7" fill="#167fa4"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="130" y="470" width="420" height="230" rx="16" fill="#ffffff" opacity=".06"/>
    <text x="170" y="540" font-size="26" letter-spacing="4" fill="#8fb9c8">LCP</text>
    <text x="170" y="630" font-size="76" font-weight="700" fill="#ffffff">2,1 s</text>
    <text x="170" y="676" font-size="24" fill="#6aa86a">bon · &lt; 2,5 s</text>

    <rect x="590" y="470" width="420" height="230" rx="16" fill="#ffffff" opacity=".06"/>
    <text x="630" y="540" font-size="26" letter-spacing="4" fill="#8fb9c8">INP</text>
    <text x="630" y="630" font-size="76" font-weight="700" fill="#ffffff">180 ms</text>
    <text x="630" y="676" font-size="24" fill="#6aa86a">bon · &lt; 200 ms</text>

    <rect x="1050" y="470" width="420" height="230" rx="16" fill="#ffffff" opacity=".06"/>
    <text x="1090" y="540" font-size="26" letter-spacing="4" fill="#8fb9c8">CLS</text>
    <text x="1090" y="630" font-size="76" font-weight="700" fill="#ffffff">0,04</text>
    <text x="1090" y="676" font-size="24" fill="#6aa86a">bon · &lt; 0,1</text>
  </g>

  <text x="130" y="810" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#c4dbe5">
    Trois mesures, trois causes différentes — et trois correctifs qui n'ont rien à voir.
  </text>

  <!-- médaillon de l'intervenant, comme dans un partage d'écran -->
  <g>
    <rect x="1500" y="700" width="300" height="230" rx="18" fill="#123a4a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
    <circle cx="1650" cy="790" r="52" fill="#167fa4"/>
    <circle cx="1650" cy="772" r="21" fill="#0a2430" opacity=".55"/>
    <path d="M1613 826a37 37 0 0 1 74 0Z" fill="#0a2430" opacity=".55"/>
    <text x="1650" y="884" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700"
          fill="#ffffff" text-anchor="middle">Yann Ravelo</text>
    <text x="1650" y="914" font-family="Arial, Helvetica, sans-serif" font-size="20"
          fill="#8fb9c8" text-anchor="middle">Datum Academy</text>
  </g>

  <!-- pied de diapositive -->
  <g transform="translate(130 940) scale(0.42)" fill="#ffffff" opacity=".65">
    <rect width="42" height="10"/><rect x="76" width="42" height="10"/>
    <rect y="20" width="118" height="10"/><rect y="40" width="118" height="10"/>
    <rect y="60" width="118" height="10"/>
    <rect y="80" width="42" height="10"/><rect x="76" y="80" width="42" height="10"/>
    <rect y="100" width="42" height="10"/><rect x="76" y="100" width="42" height="10"/>
  </g>
  <text x="200" y="985" font-family="Arial, Helvetica, sans-serif" font-size="24"
        fill="#8fb9c8" letter-spacing="2">Webinaire du 15 septembre 2026</text>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
