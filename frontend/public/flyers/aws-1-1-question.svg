<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Flyer — panne un vendredi soir, format 1:1">
  <title>Serveur qui tombe un vendredi soir ? — 1080 × 1080</title>

  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3b4d"/>
      <stop offset="1" stop-color="#1a2430"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#dusk)"/>

  <!-- Courbe de charge : le pic du vendredi soir, absorbé par la mise à l'échelle. -->
  <path d="M0 820 L120 806 L240 828 L360 770 L480 792 L600 610 L660 500 L720 586 L840 742 L960 766 L1080 752"
        fill="none" stroke="#ff9900" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
  <path d="M0 820 L120 806 L240 828 L360 770 L480 792 L600 610 L660 500 L720 586 L840 742 L960 766 L1080 752 L1080 1080 L0 1080 Z"
        fill="#ff9900" opacity=".09"/>
  <circle cx="660" cy="500" r="15" fill="#ff9900"/>
  <text x="660" y="460" font-family="Arial, Helvetica, sans-serif" font-size="25"
        fill="#ff9900" text-anchor="middle" letter-spacing="2">VENDREDI 21 H</text>

  <g transform="translate(80 76) scale(0.55)" fill="#ffffff">
    <rect width="42" height="10"/><rect x="76" width="42" height="10"/>
    <rect y="20" width="118" height="10"/><rect y="40" width="118" height="10"/>
    <rect y="60" width="118" height="10"/>
    <rect y="80" width="42" height="10"/><rect x="76" y="80" width="42" height="10"/>
    <rect y="100" width="42" height="10"/><rect x="76" y="100" width="42" height="10"/>
  </g>
  <text x="155" y="120" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"
        letter-spacing="5" fill="#ffffff" opacity=".8">DATUM ACADEMY</text>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#ffffff" letter-spacing="-1">
    <tspan x="80" y="275" font-size="80">SERVEUR QUI TOMBE</tspan>
    <tspan x="80" y="363" font-size="80">UN VENDREDI SOIR <tspan fill="#ff9900">?</tspan></tspan>
  </text>

  <text x="80" y="955" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#c3cfd9">
    La mise à l'échelle automatique s'en occupe.
  </text>
  <text x="80" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#ff9900">
    Racontez-nous votre pire panne en commentaire.
  </text>
</svg>
