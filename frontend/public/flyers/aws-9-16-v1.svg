<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Visuel v1 — première génération, format 9:16">
  <title>Formation Cloud AWS — v1, 1080 × 1920</title>

  <!-- v1 : premier jet, issu du brief seul. Teintes douces, texte posé
       directement sur le fond — c'est ce manque de contraste que la
       version 2 corrige. -->
  <defs>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe0e8"/>
      <stop offset="1" stop-color="#9fbccb"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#soft)"/>
  <circle cx="860" cy="520" r="340" fill="#ffffff" opacity=".3"/>
  <circle cx="220" cy="1430" r="280" fill="#ffffff" opacity=".22"/>

  <g transform="translate(90 120) scale(0.6)" fill="#ffffff">
    <rect width="42" height="10"/><rect x="76" width="42" height="10"/>
    <rect y="20" width="118" height="10"/><rect y="40" width="118" height="10"/>
    <rect y="60" width="118" height="10"/>
    <rect y="80" width="42" height="10"/><rect x="76" y="80" width="42" height="10"/>
    <rect y="100" width="42" height="10"/><rect x="76" y="100" width="42" height="10"/>
  </g>
  <text x="178" y="170" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700"
        letter-spacing="5" fill="#ffffff">DATUM ACADEMY</text>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#ffffff" letter-spacing="-1">
    <tspan x="90" y="880" font-size="106">FORMATION</tspan>
    <tspan x="90" y="990" font-size="106">CLOUD AWS</tspan>
  </text>

  <text font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#ffffff">
    <tspan x="90" y="1090">De « j'en ai entendu parler »</tspan>
    <tspan x="90" y="1144">à « je déploie en production ».</tspan>
  </text>

  <text x="90" y="1700" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#ffffff">
    21 septembre · 12 places
  </text>
  <text x="90" y="1756" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ffffff" opacity=".85">
    datumacademy.com
  </text>
</svg>
