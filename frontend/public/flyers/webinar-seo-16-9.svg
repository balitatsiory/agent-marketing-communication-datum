<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Bannière de promotion du webinaire sur le SEO technique, format 16:9">
  <title>Webinaire — Les bases du SEO technique · 1920 × 1080</title>

  <!-- Charte Datum : fond #073C4E, accent #167FA4. Contrairement aux
       flyers de la formation AWS, le sujet est ici Datum lui-même :
       c'est donc la palette de la marque qui s'applique. -->
  <rect width="1920" height="1080" fill="#073c4e"/>
  <circle cx="1560" cy="300" r="470" fill="#167fa4" opacity=".16"/>
  <circle cx="1700" cy="880" r="260" fill="#ffffff" opacity=".04"/>
  <rect x="0" y="0" width="1920" height="12" fill="#167fa4"/>

  <g transform="translate(120 110) scale(0.75)" fill="#ffffff">
    <rect width="42" height="10"/><rect x="76" width="42" height="10"/>
    <rect y="20" width="118" height="10"/><rect y="40" width="118" height="10"/>
    <rect y="60" width="118" height="10"/>
    <rect y="80" width="42" height="10"/><rect x="76" y="80" width="42" height="10"/>
    <rect y="100" width="42" height="10"/><rect x="76" y="100" width="42" height="10"/>
  </g>
  <text x="235" y="175" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700"
        letter-spacing="7" fill="#ffffff" opacity=".9">DATUM ACADEMY</text>

  <text x="120" y="330" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700"
        letter-spacing="10" fill="#7fc3dc">WEBINAIRE · GRATUIT</text>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#ffffff" letter-spacing="-2">
    <tspan x="120" y="500" font-size="132">LES BASES DU</tspan>
    <tspan x="120" y="636" font-size="132">SEO <tspan fill="#7fc3dc">TECHNIQUE</tspan></tspan>
  </text>

  <rect x="120" y="700" width="170" height="8" fill="#167fa4"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#c4dbe5">
    <text x="120" y="790">Indexation · maillage interne · Core Web Vitals</text>
    <text x="120" y="852">Animé par Yann Ravelo, formateur à Datum Academy</text>
  </g>

  <rect x="120" y="920" width="620" height="92" rx="46" fill="#167fa4"/>
  <text x="430" y="978" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">15 SEPTEMBRE · 20 H</text>

  <text x="790" y="978" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#8fb9c8">
    Inscription sur datumacademy.com
  </text>
</svg>
