# Configuration d'Alembic.
#
# L'URL de la base n'est PAS écrite ici : elle est lue depuis le .env par
# alembic/env.py, pour qu'il n'existe qu'une seule source de vérité.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Les migrations sont nommées à la main, une par module, préfixée de son numéro
# d'ordre : 0001_auth_utilisateurs_et_droits.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
