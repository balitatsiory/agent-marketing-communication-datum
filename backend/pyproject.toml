[project]
name = "iagora-backend"
version = "0.1.0"
description = "API de la plateforme IAGORA — agent IA de marketing et communication digitale"
requires-python = ">=3.12"

# Les dépendances sont dans requirements.txt et requirements-dev.txt.
# Ce fichier décrit le projet et configure l'outillage.

# ---------------------------------------------------------------------------
# ruff — mise en forme et analyse statique
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # tri des imports
    "N",        # conventions de nommage
    "UP",       # tournures modernes
    "B",        # pièges courants
    "SIM",      # simplifications
    "C4",       # compréhensions
    "PTH",      # pathlib plutôt que os.path
    "RUF",
]
ignore = [
    "B008",  # FastAPI utilise des appels en valeur par défaut : Depends(...)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# __table_args__ est un dictionnaire de classe : forme imposée par SQLAlchemy.
"**/models.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# --import-mode=importlib : chaque test est chargé par son chemin, avec un nom
# unique. Deux modules peuvent ainsi avoir leur tests/modules/<nom>/test_router.py
# sans __init__.py dans les dossiers de tests.
addopts = "-q --import-mode=importlib"
pythonpath = ["."]
